services:
    backend:

      container_name: monitoring-backend

      build:
        context: ./app/backend
      
      env_file:
        - ./app/backend/.env

      # ports:
      #   - "3000:3000"
      restart:  unless-stopped

      healthcheck: 
        test: ["CMD","curl","-f","http://localhost:3000/api/health"]
        interval: 30s
        timeout: 10s
        retries: 3
        start_period: 30s

      # (dev) share aws credentials from host
      volumes:
        - ~/.aws:/root/.aws:ro    

      networks:
        - monitoring-network

    frontend:

      container_name: monitoring-frontend

      build:
        context: ./app/frontend

      env_file:
        - ./app/frontend/.env

      ports:
        - "80:80"

      depends_on:
        backend:
          condition: service_healthy
        alert-service:
          condition: service_healthy

      restart:  unless-stopped

      networks:
        - monitoring-network


    alert-service:

      container_name: monitoring-alert-service

      build:
        context: ./app/alert-service

      env_file:
        - ./app/alert-service/.env

      depends_on:
        backend:
          condition: service_healthy
        postgres:
          condition: service_healthy

      restart:  unless-stopped

      healthcheck: 
        test: ["CMD","curl","-f","http://localhost:3001/api/alerts/health"]
        interval: 20s
        timeout: 10s
        retries: 3
        start_period: 30s

      networks:
        - monitoring-network


    postgres:

      container_name: monitoring-postgres

      image: postgres:16

      env_file:
        - ./docker/postgres.env

      restart: unless-stopped
      # Check status of service 

      # environment:

      #   POSTGRES_DB: ${POSTGRES_DB}

      #   POSTGRES_USER: ${POSTGRES_USER}

      #   POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      healthcheck:

        test: ["CMD-SHELL", "pg_isready -U postgres"]

        interval: 10s

        timeout: 5s

        retries: 5
        
        # ignore errors for 20 seconds
        start_period: 20s


      volumes:
        - postgres_data:/var/lib/postgresql/data
        - ./docker/init:/docker-entrypoint-initdb.d:ro

      networks:
        - monitoring-network




# unique  persistant volume 
volumes:
  postgres_data:

networks:

  monitoring-network:
    driver: bridge